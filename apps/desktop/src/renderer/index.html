<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The renderer loads nothing from the network and evaluates no inline
      script: everything it needs arrives over the preload bridge.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'"
    />
    <meta name="color-scheme" content="dark" />
    <!--
      FOUC guard. `main.tsx` sets `data-brand` before the first render, once the
      Prism token sheet is already imported, so nothing paints until the palette
      is resolved. Until then the window's own `backgroundColor` shows through,
      and that is already the renderer's base colour (set in main.ts before the
      BrowserWindow is constructed). Hence html and body stay transparent.
    -->
    <style>
      html:not([data-brand]) #app {
        visibility: hidden;
      }
      html,
      body {
        background: transparent;
      }
    </style>
    <title>Foundry</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
