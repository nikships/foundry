<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The renderer loads nothing from the network and evaluates no inline
      script: everything it needs arrives over the preload bridge.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'"
    />
    <meta name="color-scheme" content="dark light" />
    <!--
      FOUC guard. The app store releases the renderer only after persisted settings
      have selected the palette. Until then the matching native window background
      shows through, so html and body stay transparent.
    -->
    <style>
      html:not([data-theme-ready]) #app {
        visibility: hidden;
      }
      html,
      body {
        background: transparent;
      }
    </style>
    <title>Foundry</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
