<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The renderer loads nothing from the network and evaluates no inline
      script: everything it needs arrives over the preload bridge.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'"
    />
    <meta name="color-scheme" content="dark" />
    <!--
      FOUC guard. `main.tsx` sets `data-brand` only after the brand's token
      sheet has loaded, so nothing paints until exactly one palette is resolved.
      Until then the window's own `backgroundColor` shows through, and that is
      already the brand's base colour: main reads the brand synchronously before
      the BrowserWindow is constructed. Hence html and body stay transparent.
    -->
    <style>
      html:not([data-brand]) #app {
        visibility: hidden;
      }
      html,
      body {
        background: transparent;
      }
    </style>
    <title>Foundry</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
