name: Foundry CodeQL

paths:
  - .

paths-ignore:
  - out
  - dist
  - node_modules
  - assets
  # Standalone marketing site: static, ships no app code, and is not part of
  # the desktop build. The check itself still runs and reports on every PR —
  # only the scan scope excludes this folder.
  - apps/website
  - apps/android
  - '**/*.test.ts'
  - 'apps/desktop/tests/**'
