name: Code Review

on:
  pull_request:
    types: [opened, synchronize, labeled]
    branches: [main]

jobs:
  review:
    if: contains(github.event.pull_request.labels.*.name, 'junie-review')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: JetBrains/junie-github-action@main
        with:
          junie_api_key: ${{ secrets.JUNIE_API_KEY }}
          use_single_comment: "true"
          prompt: "code-review"
          junie_version: "latest"
          # The action has no reasoning-effort input, but it interpolates `model`
          # unquoted into the Junie flag list, so the effort flag rides along.
          model: "grok-4.5 --effort=high"
