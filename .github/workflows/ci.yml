name: CI

# Agent-ready verification for the Foundry desktop app.
# Public repo: free GitHub-hosted minutes. All jobs run on GitHub runners.

on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/**'
  # No paths filter here, on purpose. verify and actionlint are required checks
  # on main, and a required check that never starts is never satisfied: a PR
  # touching only docs or assets is then blocked forever, and even an admin
  # merge is refused. Both jobs are cheap enough to run on every PR.
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # ── Quality gates (types / lint / format / dead code / tests / build / audit)
  verify:
    name: verify
    runs-on: macos-26
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Dead code (knip)
        run: npm run knip

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Dependency audit
        # Fails on high/critical only so moderate noise does not block PRs.
        run: npm run audit:deps

  # ── Workflow hygiene ───────────────────────────────────────────────────────
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download actionlint
        run: |
          set -euo pipefail
          # 1.7.12+ knows macos-26; older pins reject it as an unknown label.
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -version

      - name: Lint workflows
        run: |
          set -euo pipefail
          ./actionlint -shellcheck=
