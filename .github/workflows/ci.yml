name: CI

# Agent-ready verification for the Foundry desktop app.
# Public repo: free GitHub-hosted minutes. All jobs run on GitHub runners.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - 'electron.vite.config.ts'
      - 'electron-builder.yml'
      - '*.config.*'
      - '.github/workflows/**'
      - 'android/**'
  # No paths filter here, on purpose. verify, android, and actionlint are required checks
  # on main, and a required check that never starts is never satisfied: a PR
  # touching only docs or assets is then blocked forever, and even an admin
  # merge is refused. All required jobs are cheap enough to run on every PR.
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # ── Quality gates (types / lint / format / dead code / tests / build / audit)
  verify:
    name: verify
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Documented commands
        # Static check that the commands in AGENTS.md / README / Makefile /
        # workflows still resolve to real npm scripts and make targets.
        run: npm run check:docs

      - name: Dead code (knip)
        run: npm run knip

      - name: Test
        # Coverage thresholds live in vitest.config.ts, so the local gate
        # (npm run check) and CI enforce exactly the same floor.
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Dependency audit
        # Fails on high/critical only so moderate noise does not block PRs.
        run: npm run audit:deps

  # ── Android unit tests ─────────────────────────────────────────────────────
  android:
    name: android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Run Android unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest

  # ── Workflow hygiene ───────────────────────────────────────────────────────
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download actionlint
        run: |
          set -euo pipefail
          # 1.7.12+ knows macos-26; older pins reject it as an unknown label.
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -version

      - name: Lint workflows
        run: |
          set -euo pipefail
          ./actionlint -shellcheck=

  # ── Electron UI smoke (advisory) ───────────────────────────────────────────
  # Playwright launches the built app against isolated fixtures. Needs a real
  # macOS window server, so it is NOT part of `npm run check` and is not a
  # required status check. Promote once the flake rate is known.
  e2e:
    name: e2e
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Electron UI smoke
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-playwright
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
