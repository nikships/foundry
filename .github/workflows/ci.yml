name: CI

# Agent-ready verification for the Foundry desktop app.
# Public-repo safety: fork PRs stay on GitHub-hosted macos-latest; own branches/PRs use the Mini.

on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/**'
  # No paths filter here, on purpose. verify and actionlint are required checks
  # on main, and a required check that never starts is never satisfied: a PR
  # touching only docs or assets is then blocked forever, and even an admin
  # merge is refused. Both jobs are cheap enough to run on every PR.
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # ── Quality gates (types / lint / format / dead code / tests / build / audit)
  verify:
    name: verify
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'macos-latest' || fromJSON('["self-hosted", "mac-mini", "nikships-software-factory"]') }}
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode on NVMe
        if: runner.environment == 'self-hosted'
        working-directory: .
        run: |
          set -euo pipefail
          XCODE_APP="/Volumes/NVMe/Xcode.app"
          test -d "$XCODE_APP/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          echo "$XCODE_APP/Contents/Developer/usr/bin" >> "$GITHUB_PATH"
          node -v
          npm -v

      - name: Setup Node
        if: runner.environment == 'github-hosted'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Dead code (knip)
        run: npm run knip

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Dependency audit
        # Fails on high/critical only so moderate noise does not block PRs.
        run: npm run audit:deps

  # ── Workflow hygiene ───────────────────────────────────────────────────────
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download actionlint
        # Pin the binary release; the labels ignore list is for this repo's Mini.
        run: |
          set -euo pipefail
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -version

      - name: Lint workflows
        run: |
          set -euo pipefail
          ./actionlint \
            -shellcheck= \
            -ignore 'label "self-hosted"' \
            -ignore 'label "mac-mini"' \
            -ignore 'label "nikships-software-factory"' \
            -ignore 'label "macOS"' \
            -ignore 'label "ARM64"'
