name: Update CLIProxyAPI

# Pins the next CLIProxyAPI release in package.json config.bridge (version +
# archive/binary sha256). The binary itself is never committed; mac-package.yml
# runs `npm run fetch:bridge` before electron-builder.
#
# AUTO_UPDATE_TOKEN must be a PAT with repo + workflow. GITHUB_TOKEN cannot
# start CI on the bump PR or mac-package after merge.

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-cliproxyapi
  cancel-in-progress: true

jobs:
  update:
    name: Check & bump CLIProxyAPI
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.AUTO_UPDATE_TOKEN }}

    steps:
      - name: Require AUTO_UPDATE_TOKEN
        env:
          AUTO_UPDATE_TOKEN: ${{ secrets.AUTO_UPDATE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${AUTO_UPDATE_TOKEN}" ]; then
            echo "::error::AUTO_UPDATE_TOKEN is required so the bump PR triggers CI and merging it triggers mac-package. Store a PAT with repo + workflow as AUTO_UPDATE_TOKEN."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.AUTO_UPDATE_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Get latest upstream release
        id: upstream
        run: |
          set -euo pipefail

          RELEASE_JSON=$(curl -sf \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "User-Agent: foundry-update-cliproxyapi" \
            https://api.github.com/repos/router-for-me/CLIProxyAPI/releases/latest)
          TAG=$(echo "$RELEASE_JSON" | jq -r '.tag_name')
          VERSION="${TAG#v}"

          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::Failed to fetch latest CLIProxyAPI release"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Latest upstream: $VERSION"

      - name: Check if already up to date
        id: check
        env:
          UPSTREAM: ${{ steps.upstream.outputs.version }}
        run: |
          set -euo pipefail

          PINNED=$(node -p "require('./package.json').config.bridge.version")
          if [ "$PINNED" = "$UPSTREAM" ]; then
            echo "v${UPSTREAM} already pinned, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          EXISTING=$(gh pr list --state open --json headRefName --jq '.[].headRefName' \
            | grep -F "bump-cliproxyapi-${UPSTREAM}" || true)
          if [ -n "$EXISTING" ]; then
            echo "PR already exists for v${UPSTREAM}, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Pinned ${PINNED} -> ${UPSTREAM}"

      - name: Close superseded bump PRs
        if: steps.check.outputs.skip == 'false'
        run: |
          set -e

          OLD_PRS=$(gh pr list --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("bump-cliproxyapi-")) | .number' || true)

          for PR in $OLD_PRS; do
            echo "Closing superseded PR #$PR"
            gh pr close "$PR" --comment "Superseded by newer version bump." --delete-branch || true
          done

      - name: Bump pin and checksums
        if: steps.check.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/fetch-bridge.mjs --bump "$VERSION"

      - name: Create pull request
        if: steps.check.outputs.skip == 'false'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.AUTO_UPDATE_TOKEN }}
          commit-message: 'chore(deps): bump CLIProxyAPI to ${{ steps.upstream.outputs.version }}'
          title: 'chore(deps): bump CLIProxyAPI to ${{ steps.upstream.outputs.version }}'
          body: |
            Updates the pinned CLIProxyAPI Bridge to [${{ steps.upstream.outputs.version }}](https://github.com/router-for-me/CLIProxyAPI/releases/tag/${{ steps.upstream.outputs.tag }}).

            This PR only changes `package.json` `config.bridge` (version + archive/binary sha256). The binary is not committed; `mac-package.yml` downloads it with `npm run fetch:bridge` before signing.

            Merging this PR to `main` will trigger a new signed release via `mac-package.yml`.

            _Auto-generated by the Update CLIProxyAPI workflow._
          branch: bump-cliproxyapi-${{ steps.upstream.outputs.version }}
          delete-branch: true
          add-paths: package.json
