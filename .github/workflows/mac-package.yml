name: Mac package (sign + notarize)

# Builds the Foundry Electron app on GitHub-hosted macOS 26, Developer ID-signs
# from secrets, notarizes with Apple, staples, and uploads the DMG.
# Public repo: free hosted minutes. No pull_request trigger (release path only).

on:
  # Path filters apply to main only; explicit `v*` tags still always package.
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'apps/desktop/**'
      - 'assets/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - 'electron.vite.config.ts'
      - 'electron-builder.yml'
      - 'tsconfig.json'
      - '.github/workflows/mac-package.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Release publication is shared with android-package.yml. Serializing both
  # workflows ensures a commit that changes both platforms leaves the newest
  # release with both artifacts regardless of which build finishes first.
  group: foundry-latest-release
  cancel-in-progress: false

jobs:
  package:
    name: Build, sign, notarize
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set rolling release version
        # electron-updater only offers an update when latest-mac.yml's version
        # is newer than the installed app. Reusing package.json's version reads
        # as "no update". Stamp major.minor from package.json and the run number
        # as patch (always increasing) in the working tree only. Do not push
        # back to main: branch protection requires PRs + status checks, and
        # GITHUB_TOKEN cannot bypass that on a user-owned repo.
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        working-directory: .
        run: |
          set -euo pipefail
          PREV=$(node -p "require('./package.json').version")
          NEW=$(node -p "
            const [maj, min] = require('./package.json').version.split('.');
            maj + '.' + min + '.' + process.env.GITHUB_RUN_NUMBER
          ")
          npm version "$NEW" --no-git-tag-version --allow-same-version
          echo "Version (local only): $PREV -> $NEW"
          echo "RELEASE_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Import Developer ID certificate
        env:
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        working-directory: .
        run: |
          set -euo pipefail
          if [ -z "${MAC_CERTS:-}" ] || [ -z "${CERT_PASSWORD:-}" ]; then
            echo "::error::MAC_CERTS and CERT_PASSWORD secrets are required for signing."
            exit 1
          fi

          KC="$RUNNER_TEMP/foundry-signing.keychain-db"
          KC_PASS=$(openssl rand -base64 24)
          echo "KEYCHAIN_PATH=$KC" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KC_PASS" >> "$GITHUB_ENV"

          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"

          P12="$RUNNER_TEMP/developer-id.p12"
          echo "$MAC_CERTS" | base64 --decode > "$P12"
          security import "$P12" -k "$KC" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productsign -A
          rm -f "$P12"

          # Allow codesign to use the private key without a GUI prompt.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" >/dev/null

          # Prefer our temp keychain first, keep system certs available.
          security list-keychains -d user -s "$KC" login.keychain
          security default-keychain -s "$KC"

          echo "Available signing identities:"
          security find-identity -v -p codesigning "$KC"
          if ! security find-identity -v -p codesigning "$KC" | grep -q "Developer ID Application"; then
            echo "::error::No Developer ID Application identity after import."
            exit 1
          fi

      - name: Install npm dependencies
        run: |
          set -euo pipefail
          npm ci
          # better-sqlite3 needs the electron ABI; package rebuilds it, but
          # fail early if the binding is missing after install scripts.
          test -d node_modules/electron
          test -d node_modules/better-sqlite3

      - name: Package (build + icons + fetch:bridge + electron-builder)
        env:
          # Hash pins Developer ID Application when the P12 also carries App Store certs.
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
          CSC_NAME: '734BE283C1325CCCBB7EC1BAF93539843702652A'
          # Explicitly disable publish; CI detection would otherwise try GH releases.
          EP_DRAFT: 'true'
        run: |
          set -euo pipefail
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          sw_vers
          xcodebuild -version
          /usr/bin/xcrun --find notarytool
          /usr/bin/xcrun --find stapler
          node -v
          npm -v

          npm run build
          npm run icons
          # extraResources copies resources/bridge into the app, and
          # mac.binaries then codesigns Contents/Resources/bridge/cli-proxy-api.
          # Without the fetch that path does not exist and signing fails.
          npm run fetch:bridge
          test -x resources/bridge/cli-proxy-api
          npx electron-builder --mac --arm64 --publish never
          APP="dist/mac-arm64/Foundry.app"
          test -d "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          IDENTITY=$(codesign -dv --verbose=2 "$APP" 2>&1 | grep 'Authority=Developer ID Application' || true)
          echo "$IDENTITY"
          echo "$IDENTITY" | grep -q 'Developer ID Application' || {
            echo "::error::App was not signed with Developer ID Application"
            codesign -dv --verbose=2 "$APP" 2>&1 || true
            exit 1
          }
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -E 'Authority|TeamIdentifier|Identifier|Runtime'

      - name: Notarize + staple app and DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_ID:-}" ] || [ -z "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] || [ -z "${APPLE_TEAM_ID:-}" ]; then
            echo "::error::APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, and APPLE_TEAM_ID are required."
            exit 1
          fi

          APP="dist/mac-arm64/Foundry.app"
          DMG=$(find dist -maxdepth 1 -type f -name 'Foundry-*-arm64.dmg' -print -quit)
          test -f "$DMG"
          ZIP="$RUNNER_TEMP/Foundry-notarize.zip"
          rm -f "$ZIP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"

          # Apple's notary service intermittently drops the connection
          # (HTTPClientError.connectTimeout). Retry so one flaky round trip
          # does not discard an otherwise good signed build.
          retry() {
            local label="$1"
            shift
            local attempt=1
            until "$@"; do
              if [ "$attempt" -ge 3 ]; then
                echo "::error::$label failed after $attempt attempts"
                return 1
              fi
              echo "$label failed (attempt $attempt), retrying in $((attempt * 30))s"
              sleep "$((attempt * 30))"
              attempt=$((attempt + 1))
            done
          }

          # Each attempt overwrites the response file, so a timed-out attempt
          # never leaves partial JSON in front of the successful one.
          NOTARY_OUT="$RUNNER_TEMP/notary-response.json"
          notarize() {
            local artifact="$1"
            /usr/bin/xcrun notarytool submit "$artifact" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait --timeout 30m --output-format json > "$NOTARY_OUT"
          }

          notary_log() {
            local id="$1"
            /usr/bin/xcrun notarytool log "$id" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" || true
          }

          echo "==> Notarizing app zip"
          retry "App notarization" notarize "$ZIP"
          cat "$NOTARY_OUT"
          STATUS=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['status'])" "$NOTARY_OUT")
          SUB_ID=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['id'])" "$NOTARY_OUT")
          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::App notarization failed: $STATUS"
            notary_log "$SUB_ID"
            exit 1
          fi
          # Stapling downloads the ticket from Apple, so it is flaky for the
          # same reason the submit is.
          retry "App staple" /usr/bin/xcrun stapler staple "$APP"
          /usr/bin/xcrun stapler validate "$APP"
          spctl -a -vvv -t install "$APP"
          rm -f "$ZIP"

          echo "==> Notarizing DMG"
          retry "DMG notarization" notarize "$DMG"
          cat "$NOTARY_OUT"
          STATUS=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['status'])" "$NOTARY_OUT")
          SUB_ID=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['id'])" "$NOTARY_OUT")
          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::DMG notarization failed: $STATUS"
            notary_log "$SUB_ID"
            exit 1
          fi
          retry "DMG staple" /usr/bin/xcrun stapler staple "$DMG"
          /usr/bin/xcrun stapler validate "$DMG"
          echo "DMG=$DMG" >> "$GITHUB_ENV"
          ls -lh "$APP" "$DMG"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: Foundry-${{ github.run_number }}-arm64
          path: |
            dist/Foundry-*-arm64.dmg
            dist/*.zip
            dist/latest-mac.yml
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release
        # Tagged pushes publish the requested release without changing Latest.
        # Main and manual builds publish a new version and promote it to Latest.
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          # github.token is the workflow token whose contents: write permission
          # is declared above. Using the context value avoids an empty or
          # repository-defined secret shadowing the token used by gh.
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          set -euo pipefail
          SRC_DMG=$(find dist -maxdepth 1 -type f -name 'Foundry-*-arm64.dmg' -print -quit)
          test -f "$SRC_DMG"
          APP="dist/mac-arm64/Foundry.app"
          test -d "$APP"

          PKG_VERSION=$(node -p "require('./package.json').version")
          RELEASE_REF="${RELEASE_SHA:-$GITHUB_SHA}"
          SHORT_SHA="${RELEASE_REF::7}"
          RUN="${{ github.run_number }}"

          update_latest_mac_yml() {
            local zip_path="$1"
            local zip_name="$2"
            local version="$3"
            local yml_path="$4"
            node - "$zip_path" "$zip_name" "$version" "$yml_path" <<'NODE'
              const fs = require("fs");
              const crypto = require("crypto");
              const zipPath = process.argv[2];
              const zipName = process.argv[3];
              const version = process.argv[4];
              const ymlPath = process.argv[5];
              const content = fs.readFileSync(zipPath);
              const sha512 = crypto.createHash("sha512").update(content).digest("base64");
              const size = content.length;
              const releaseDate = new Date().toISOString();
              const yaml = `version: ${version}\nfiles:\n  - url: ${zipName}\n    sha512: ${sha512}\n    size: ${size}\npath: ${zipName}\nsha512: ${sha512}\nreleaseDate: '${releaseDate}'\n`;
              fs.writeFileSync(ymlPath, yaml, "utf8");
          NODE
          }

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            TITLE="Foundry $TAG"
            NOTES="Signed with Developer ID and notarized by Apple. Apple Silicon only."
            STABLE_DMG="dist/Foundry-${TAG}-arm64.dmg"
            STABLE_ZIP="dist/Foundry-${TAG}-arm64-mac.zip"
            YML="dist/latest-mac.yml"

            cp "$SRC_DMG" "$STABLE_DMG"
            shasum -a 256 "$STABLE_DMG" | tee "${STABLE_DMG}.sha256"

            ditto -c -k --sequesterRsrc --keepParent "$APP" "$STABLE_ZIP"
            VERSION_NUM="${TAG#v}"
            update_latest_mac_yml "$STABLE_ZIP" "Foundry-${TAG}-arm64-mac.zip" "$VERSION_NUM" "$YML"

            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" "$STABLE_DMG" "${STABLE_DMG}.sha256" "$STABLE_ZIP" "$YML" --clobber
            else
              gh release create "$TAG" "$STABLE_DMG" "${STABLE_DMG}.sha256" "$STABLE_ZIP" "$YML" \
                --title "$TITLE" \
                --generate-notes \
                --notes "$NOTES" \
                --latest=false
            fi
            echo "Published versioned release $TAG"
            exit 0
          fi

          # Main and manual builds get a unique semver release. GitHub's
          # Latest marker then points electron-updater at this release without
          # destroying the previous working update channel first.
          TAG="v${PKG_VERSION}"
          TITLE="Foundry ${TAG}"
          NOTES="Continuous build from \`${GITHUB_REF_NAME}\` @ \`${SHORT_SHA}\` (run ${RUN}). The signed, notarized Apple Silicon app and latest signed Android companion APK are attached when available."
          STABLE_DMG="dist/Foundry-${TAG}-arm64.dmg"
          STABLE_ZIP="dist/Foundry-${TAG}-arm64-mac.zip"
          YML="dist/latest-mac.yml"

          cp "$SRC_DMG" "$STABLE_DMG"
          shasum -a 256 "$STABLE_DMG" | tee "${STABLE_DMG}.sha256"

          ditto -c -k --sequesterRsrc --keepParent "$APP" "$STABLE_ZIP"
          ZIP_NAME="$(basename "$STABLE_ZIP")"
          update_latest_mac_yml "$STABLE_ZIP" "$ZIP_NAME" "$PKG_VERSION" "$YML"

          # Android updates whichever release is currently Latest. Carry its
          # stable APK assets forward before promoting this new Mac release so
          # the one Latest page always offers both platforms. Shared workflow
          # concurrency prevents Android from changing Latest during this step.
          PREVIOUS_LATEST=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name' 2>/dev/null || true)
          ANDROID_ASSETS=()
          if [ -n "$PREVIOUS_LATEST" ] && [ "$PREVIOUS_LATEST" != "$TAG" ]; then
            PREVIOUS_ASSETS=$(gh release view "$PREVIOUS_LATEST" --json assets --jq '.assets[].name')
            if grep -Fxq 'Foundry-Android.apk' <<< "$PREVIOUS_ASSETS" && \
               grep -Fxq 'Foundry-Android.apk.sha256' <<< "$PREVIOUS_ASSETS"; then
              mkdir -p "$RUNNER_TEMP/latest-android"
              gh release download "$PREVIOUS_LATEST" \
                --pattern 'Foundry-Android.apk' \
                --pattern 'Foundry-Android.apk.sha256' \
                --dir "$RUNNER_TEMP/latest-android"
              ANDROID_ASSETS=(
                "$RUNNER_TEMP/latest-android/Foundry-Android.apk"
                "$RUNNER_TEMP/latest-android/Foundry-Android.apk.sha256"
              )
            fi
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            # A rerun can reuse the same run number. Keep the release in place
            # while replacing its assets, so a failed upload never removes it.
            gh release upload "$TAG" "$STABLE_DMG" "${STABLE_DMG}.sha256" "$STABLE_ZIP" "$YML" --clobber
            if [ "${#ANDROID_ASSETS[@]}" -gt 0 ]; then
              gh release upload "$TAG" "${ANDROID_ASSETS[@]}" --clobber
            fi
            gh release edit "$TAG" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --draft=false \
              --latest \
              --target "$RELEASE_REF"
          else
            gh release create "$TAG" "$STABLE_DMG" "${STABLE_DMG}.sha256" "$STABLE_ZIP" "$YML" "${ANDROID_ASSETS[@]}" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --latest \
              --target "$RELEASE_REF"
          fi

          # Fail the run if GitHub did not leave the exact updater manifest
          # attached to the release that was just promoted to Latest.
          gh release view "$TAG" --json isDraft,isPrerelease,assets \
            --jq 'select(.isDraft == false and .isPrerelease == false) | .assets[].name' \
            | grep -Fxq 'latest-mac.yml'
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')" = "$TAG"
          echo "Published ${TAG} and promoted it to Latest (run ${RUN})"

      - name: Cleanup signing keychain
        if: always()
        working-directory: .
        run: |
          set -euo pipefail
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi
          rm -f "$RUNNER_TEMP"/developer-id.p12 "$RUNNER_TEMP"/Foundry-notarize.zip \
            "$RUNNER_TEMP"/notary-response.json 2>/dev/null || true
