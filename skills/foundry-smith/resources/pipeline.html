<!doctype html>
<!--
  Smith preview template — pipeline.

  Fill every {{token}} by hand, HTML-escaping the values. Duplicate the block
  marked "repeat:phase" once per phase, then delete the two marker comments
  around it. See SKILL.md § Visual previews.

  Tokens: id, name, description, acceptance
  Per phase: phase_index, phase_name, phase_kind, phase_agent, phase_description,
             phase_detail
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>{{name}} — Foundry pipeline</title>
    <style>
      :root {
        --bg: #0a0a0a;
        --panel: #131313;
        --line: #262626;
        --text: #ededed;
        --dim: #8a8a8a;
        --accent: #ee6018;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 48px 5vw 72px;
        background: var(--bg);
        color: var(--text);
        font:
          15px/1.6 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }
      .id {
        color: var(--dim);
        font:
          11px/1 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        letter-spacing: 0.11em;
        text-transform: uppercase;
      }
      h1 {
        margin: 10px 0 0;
        font-size: 27px;
        font-weight: 650;
        letter-spacing: -0.01em;
      }
      .description {
        margin: 12px 0 26px;
        max-width: 72ch;
        color: var(--dim);
        font-size: 16px;
      }
      .acceptance {
        display: inline-block;
        margin-bottom: 38px;
        padding: 9px 14px;
        border: 1px solid var(--line);
        border-left: 2px solid var(--accent);
        border-radius: 5px;
        background: var(--panel);
        font:
          13px/1.4 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }
      .acceptance span {
        color: var(--dim);
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }
      .flow {
        display: flex;
        gap: 0;
        align-items: stretch;
        overflow-x: auto;
        padding-bottom: 14px;
      }
      .phase {
        display: flex;
        flex: none;
        flex-direction: column;
        width: 268px;
        padding: 17px 18px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }
      .arrow {
        display: flex;
        flex: none;
        align-items: center;
        padding: 0 12px;
        color: var(--line);
        font-size: 20px;
      }
      .phase-top {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 11px;
      }
      .index {
        color: var(--dim);
        font:
          11px/1 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }
      .kind {
        padding: 3px 8px;
        border: 1px solid var(--accent);
        border-radius: 3px;
        color: var(--accent);
        font:
          600 10px/1 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .phase-name {
        margin-bottom: 4px;
        font:
          600 15px/1.35 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        word-break: break-word;
      }
      .agent {
        margin-bottom: 10px;
        color: var(--dim);
        font:
          12px/1.4 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }
      .phase-description {
        margin-bottom: 12px;
        color: var(--text);
        font-size: 14px;
      }
      .detail {
        margin: auto 0 0;
        padding: 11px 12px;
        border-radius: 5px;
        background: #0d0d0d;
        color: var(--dim);
        font:
          12px/1.55 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <div class="id">{{id}}</div>
    <h1>{{name}}</h1>
    <p class="description">{{description}}</p>
    <div class="acceptance"><span>Acceptance</span> &nbsp;{{acceptance}}</div>

    <div class="flow">
      <!-- repeat:phase -->
      <div class="phase">
        <div class="phase-top">
          <span class="index">{{phase_index}}</span>
          <span class="kind">{{phase_kind}}</span>
        </div>
        <div class="phase-name">{{phase_name}}</div>
        <div class="agent">{{phase_agent}}</div>
        <div class="phase-description">{{phase_description}}</div>
        <pre class="detail">{{phase_detail}}</pre>
      </div>
      <div class="arrow">→</div>
      <!-- /repeat:phase -->
    </div>
  </body>
</html>
