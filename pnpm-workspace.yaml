# pnpm build-script policy (the `allowBuilds` map replaced
# `onlyBuiltDependencies`/`neverBuiltDependencies` in pnpm 11; pnpm v12 no
# longer reads the "pnpm" field in package.json).
# true  = install script runs (needed binaries: Electron, esbuild).
# false = install script stays blocked, exactly as under npm.
# better-sqlite3 13 ships prebuilds and has no install script. allowBuilds
# true makes pnpm inject `node-gyp rebuild`, which fails when node-gyp is
# not on PATH (Foundry worktree setup, and any machine without a global
# node-gyp). Mirrors the old .npmrc allow-scripts list for everything else.
# This repo is a single pnpm project: apps/website is standalone per AGENTS.md
# and keeps its own installer, so there is deliberately no `packages:` glob.
#
# pnpm 12 defaults verifyDepsBeforeRun to `install`, so every `pnpm run` /
# `pnpm exec` first runs `pnpm install`. That re-runs allowed native install
# scripts even when the lockfile is already satisfied. Install is an
# explicit step (`pnpm install --frozen-lockfile`); scripts must not mutate
# node_modules.
verifyDepsBeforeRun: false
allowBuilds:
  electron: true
  esbuild: true
  better-sqlite3: false
  '@google/genai': false
  electron-winstaller: false
  protobufjs: false
  unrs-resolver: false
