appId: com.foundry.app
productName: Foundry
publish:
  provider: github
  owner: nikships
  repo: foundry

directories:
  buildResources: assets

files:
  - out/**/*
  - package.json

# Not in `files`: those land in Resources/app, but main.ts resolves assets at
# `process.resourcesPath/assets`. extraResources copies them there directly.
extraResources:
  - assets/**/*
  # The Bridge (vendored CLIProxyAPI). It has to be a real executable file the
  # main process can spawn, which a path inside app.asar is not. Fetched by
  # `npm run fetch:bridge` (checksum-verified) before electron-builder runs.
  - from: resources/bridge
    to: bridge
    filter:
      - '**/*'
  # Shipped pi packages (see src/main/pi/packages.ts). Pi loads an extension
  # through jiti, which reads the file from disk, so these cannot live inside
  # app.asar either. Committed to the repo rather than fetched: they are part
  # of the application, not a pinned third-party download.
  - from: resources/pi-packages
    to: pi-packages
    filter:
      - '**/*'
  # Bounded Nerd Fonts SymbolsOnly face. The woff2 is also a Vite renderer
  # asset packed via `files: out/**/*`; this extraResource is the same file
  # plus licenses outside the asar so packaged-app inspection and any future
  # native fallback can read them. Do not add the full Nerd Fonts collection.
  #
  # Two `to: fonts` entries share one destination; later files overwrite.
  # Keep README.md only on the design/fonts copy so Contents/Resources/fonts
  # retains the full CC BY 4.0 table and SHA pins instead of the short pointer
  # in resources/fonts/README.md.
  - from: apps/desktop/src/renderer/design/fonts
    to: fonts
    filter:
      - 'SymbolsNerdFontMono-Regular.woff2'
      - 'LICENSE'
      - 'OFL.txt'
      - 'APACHE'
      - 'README.md'
  - from: resources/fonts
    to: fonts
    filter:
      - 'LICENSE'
      - 'OFL.txt'
      - 'APACHE'

asar: true
asarUnpack:
  # The native sqlite binding cannot be loaded from inside an asar archive.
  - '**/node_modules/better-sqlite3/**'

mac:
  category: public.app-category.developer-tools
  icon: assets/icon/app-icon.icns
  minimumSystemVersion: '26.0'
  hardenedRuntime: true
  gatekeeperAssess: false
  # A hardened-runtime app cannot launch an unsigned nested executable, and
  # notarization rejects the bundle outright. Name the Bridge explicitly rather
  # than relying on the walker to notice a file under Resources.
  binaries:
    - Contents/Resources/bridge/cli-proxy-api
  # Smith voice mode captures the microphone; the entitlement admits it under
  # the hardened runtime and the usage string is the prompt macOS shows.
  entitlements: assets/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: >-
      Smith voice mode uses the microphone to talk with you. Audio goes to the
      Gemini Live API with a short-lived token; nothing is stored.
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64

dmg:
  title: Foundry
