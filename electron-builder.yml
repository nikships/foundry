appId: com.foundry.app
productName: Foundry
publish:
  provider: github
  owner: nikships
  repo: foundry

directories:
  buildResources: assets

files:
  - out/**/*
  - package.json
  # The prebuilt Ghostty terminal engine (Smith). Kept out of `out/` so the
  # bundler never touches it: the package is CJS with __dirname-relative paths
  # (native addon, utilityProcess host) that must stay real files.
  - vendor/electron-ghostty/**/*

# Not in `files`: those land in Resources/app, but main.ts resolves assets at
# `process.resourcesPath/assets`. extraResources copies them there directly.
extraResources:
  - assets/**/*

asar: true
asarUnpack:
  # The native sqlite binding cannot be loaded from inside an asar archive.
  - '**/node_modules/better-sqlite3/**'
  # The whole ghostty engine: the .node addon cannot load from asar, and the
  # utilityProcess host (host.js) must be forkable from a real path.
  - 'vendor/electron-ghostty/**'

mac:
  category: public.app-category.developer-tools
  icon: assets/icon/app-icon.icns
  minimumSystemVersion: '26.0'
  hardenedRuntime: true
  gatekeeperAssess: false
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64

dmg:
  title: Foundry
