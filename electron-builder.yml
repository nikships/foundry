appId: com.foundry.app
productName: Foundry
publish:
  provider: github
  owner: nikships
  repo: foundry

directories:
  buildResources: assets

files:
  - out/**/*
  - package.json
  # The Smith skill is read from outside the app by the user's own agent, so it
  # has to ship in the bundle (and be unpacked below) rather than stay in the repo.
  - skills/**/*

# Not in `files`: those land in Resources/app, but main.ts resolves assets at
# `process.resourcesPath/assets`. extraResources copies them there directly.
extraResources:
  - assets/**/*
  # The Bridge (vendored CLIProxyAPI). It has to be a real executable file the
  # main process can spawn, which a path inside app.asar is not. Fetched by
  # `npm run fetch:bridge` (checksum-verified) before electron-builder runs.
  - from: resources/bridge
    to: bridge
    filter:
      - '**/*'

asar: true
asarUnpack:
  # The native sqlite binding cannot be loaded from inside an asar archive.
  - '**/node_modules/better-sqlite3/**'
  # The Smith helper CLI is run from outside the app (`node <path> …`) by
  # whatever agent loaded the foundry-smith skill. A path inside app.asar is not
  # a real file on disk, so unpack this one entry to give it one.
  - 'out/main/foundry-cli.js'
  # Same reason: an agent outside the app cannot read SKILL.md inside an asar.
  - 'skills/**'

mac:
  category: public.app-category.developer-tools
  icon: assets/icon/app-icon.icns
  minimumSystemVersion: '26.0'
  hardenedRuntime: true
  gatekeeperAssess: false
  # A hardened-runtime app cannot launch an unsigned nested executable, and
  # notarization rejects the bundle outright. Name the Bridge explicitly rather
  # than relying on the walker to notice a file under Resources.
  binaries:
    - Contents/Resources/bridge/cli-proxy-api
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64

dmg:
  title: Foundry
